<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>API Server Uptime Checker</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at top, #26324a 0, #111827 42%, #070b12 100%); color: #f8fafc; padding: 30px 16px; } .container { width: min(900px, 100%); margin: auto; } .header { text-align: center; margin-bottom: 28px; } .header h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 42px); letter-spacing: -1px; } .header p { margin: 0; color: #94a3b8; } .controls { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap; } button { border: 0; border-radius: 10px; padding: 12px 20px; font-size: 15px; font-weight: 700; cursor: pointer; transition: .2s; } #checkAll { background: #22c55e; color: #052e16; } #checkAll:hover { background: #4ade80; transform: translateY(-1px); } #checkAll:disabled { opacity: .6; cursor: wait; transform: none; } .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; } .summary-card { background: rgba(15, 23, 42, .72); border: 1px solid rgba(148, 163, 184, .15); border-radius: 14px; padding: 18px; text-align: center; backdrop-filter: blur(10px); } .summary-card strong { display: block; font-size: 28px; margin-bottom: 4px; } .summary-card span { color: #94a3b8; font-size: 13px; } .server { background: rgba(15, 23, 42, .82); border: 1px solid rgba(148, 163, 184, .16); border-radius: 16px; padding: 20px; margin-bottom: 14px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0, 0, 0, .18); } .server-top { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 15px; } .server-name { font-weight: 700; font-size: 17px; word-break: break-all; } .priority { color: #64748b; font-size: 12px; margin-top: 5px; } .status { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; } .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; } .online { color: #4ade80; background: rgba(34, 197, 94, .12); } .offline { color: #f87171; background: rgba(239, 68, 68, .12); } .checking { color: #facc15; background: rgba(250, 204, 21, .12); } .error { color: #fb923c; background: rgba(249, 115, 22, .12); } .details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; } .detail { background: rgba(2, 6, 23, .45); border-radius: 10px; padding: 12px; } .detail-label { color: #64748b; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; } .detail-value { font-size: 14px; font-weight: 600; word-break: break-word; } .footer { color: #64748b; text-align: center; font-size: 12px; margin-top: 24px; line-height: 1.6; } @media (max-width: 600px) { .summary { grid-template-columns: 1fr 1fr 1fr; } .details { grid-template-columns: 1fr 1fr; } .server-top { align-items: flex-start; flex-direction: column; } .status { align-self: flex-start; } } </style> </head> <body> <div class="container"> <div class="header"> <h1>API Server Uptime Checker</h1> <p>Monitor your API servers in real time</p> </div> <div class="controls"> <button id="checkAll" onclick="checkAllServers()"> Check All Servers </button> </div> <div class="summary"> <div class="summary-card"> <strong id="total">5</strong> <span>Total Servers</span> </div>
<div class="summary-card">
  <strong id="online" style="color:#4ade80">0</strong>
  <span>Online</span>
</div>

<div class="summary-card">
  <strong id="offline" style="color:#f87171">0</strong>
  <span>Offline</span>
</div>

</div> <div id="servers"></div> <div class="footer"> Checks are performed directly from your browser.<br> HTTP status codes require the API servers to allow CORS requests. </div> </div> <script> /* * API SERVERS * Priority 1 = primary * Priority 5 = lowest priority */ const servers = [ { url: "https://papi-ver2.online/rev7/api/", priority: 1 }, { url: "https://saddlebrown-gnu-658159.hostingersite.com/rev7/api/", priority: 2 }, { url: "https://midnightblue-herring-134619.hostingersite.com/rev7/api/", priority: 3 }, { url: "https://orangered-grouse-134812.hostingersite.com/rev7/api/", priority: 4 }, { url: "https://bisque-hippopotamus-634458.hostingersite.com/rev7/api/", priority: 5 } ]; const serverContainer = document.getElementById("servers"); /* * Store the latest result for each server. */ const serverResults = servers.map(() => ({ status: "checking" })); /* * CREATE SERVER CARDS */ function createServerCards() { serverContainer.innerHTML = servers.map((server, index) => ` <div class="server" id="server-${index}"> <div class="server-top"> <div> <div class="server-name"> ${escapeHtml(server.url)} </div> <div class="priority"> Priority ${server.priority} </div> </div> <div class="status checking" id="status-${index}" > Checking... </div> </div> <div class="details"> <div class="detail"> <div class="detail-label"> Status Code </div> <div class="detail-value" id="code-${index}" > — </div> </div> <div class="detail"> <div class="detail-label"> Response Time </div> <div class="detail-value" id="time-${index}" > — </div> </div> <div class="detail"> <div class="detail-label"> Last Checked </div> <div class="detail-value" id="checked-${index}" > — </div> </div> </div> </div> `).join(""); } /* * ESCAPE HTML */ function escapeHtml(value) { return value .replaceAll("&", "&amp;") .replaceAll("<", "&lt;") .replaceAll(">", "&gt;") .replaceAll('"', "&quot;") .replaceAll("'", "&#039;"); } /* * CHECK ONE SERVER */ async function checkServer(server, index) { const statusEl = document.getElementById(`status-${index}`); const codeEl = document.getElementById(`code-${index}`); const timeEl = document.getElementById(`time-${index}`); const checkedEl = document.getElementById(`checked-${index}`); /* * Reset UI */ statusEl.className = "status checking"; statusEl.textContent = "Checking..."; codeEl.textContent = "—"; timeEl.textContent = "—"; serverResults[index].status = "checking"; const start = performance.now(); try { /* * Normal CORS request. * * This allows us to read response.status * if the API server sends the correct * Access-Control-Allow-Origin header. */ const response = await fetch(server.url, { method: "GET", mode: "cors", cache: "no-store" }); const elapsed = Math.round(performance.now() - start); /* * HTTP 2xx / 3xx = reachable. * HTTP 4xx / 5xx = server responded, * but the endpoint returned an error. */ if (response.ok) { statusEl.className = "status online"; statusEl.textContent = "Online"; codeEl.textContent = `${response.status} ${response.statusText || ""}`.trim(); serverResults[index].status = "online"; } else { statusEl.className = "status offline"; statusEl.textContent = "HTTP Error"; codeEl.textContent = `${response.status} ${response.statusText || ""}`.trim(); serverResults[index].status = "offline"; } timeEl.textContent = `${elapsed} ms`; } catch (error) { const elapsed = Math.round(performance.now() - start); /* * Usually means: * - CORS blocked the response * - DNS failure * - connection refused * - TLS error * - server unreachable */ statusEl.className = "status error"; statusEl.textContent = "Connection Error"; codeEl.textContent = "CORS / Network"; timeEl.textContent = `${elapsed} ms`; serverResults[index].status = "offline"; } checkedEl.textContent = new Date().toLocaleTimeString(); } /* * CHECK ALL SERVERS */ async function checkAllServers() { const button = document.getElementById("checkAll"); button.disabled = true; button.textContent = "Checking..."; /* * Check all five servers simultaneously. */ await Promise.all( servers.map((server, index) => checkServer(server, index) ) ); updateSummary(); button.disabled = false; button.textContent = "Check All Servers"; } /* * UPDATE SUMMARY */ function updateSummary() { let online = 0; let offline = 0; serverResults.forEach(result => { if (result.status === "online") { online++; } if (result.status === "offline") { offline++; } }); document.getElementById("online") .textContent = online; document.getElementById("offline") .textContent = offline; } /* * INITIALIZE */ createServerCards(); checkAllServers(); /* * AUTOMATIC CHECK EVERY 60 SECONDS */ setInterval(() => { /* * Don't start another check if the * previous check is still running. */ const button = document.getElementById("checkAll"); if (!button.disabled) { checkAllServers(); } }, 60000); </script> </body> </html>
